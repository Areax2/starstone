<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StarStone Mining Pass Preview</title>
<style>
  body{background:#05050f; font-family:'Segoe UI', system-ui, sans-serif; padding:28px;}
  .nft{width:520px; height:520px; border-radius:24px; position:relative; overflow:hidden;
       background:radial-gradient(600px 420px at 50% 30%, #2a2340 0%, #0d0d26 60%, #070716 100%); color:#eef0ff; border:1px solid #4a3a14;}
  canvas.art{position:absolute; top:4px; left:20px;}
  .info{position:absolute; left:0; right:0; bottom:0; padding:18px 24px 20px; background:linear-gradient(180deg, rgba(6,6,20,0) 0%, rgba(6,6,20,.92) 32%);}
  .name{font-size:26px; font-weight:800; letter-spacing:1px;}
  .tier{font-size:15px; font-weight:700; margin-top:2px; color:#ffd964;}
  .chips{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .chip{background:rgba(255,217,100,.08); border:1px solid rgba(255,217,100,.35); border-radius:99px; padding:5px 12px; font-size:12.5px;}
  .meta{margin-top:12px; font-size:12px; color:#9a9cc9;}
  .brand{position:absolute; top:16px; left:22px; font-size:12px; letter-spacing:3px; color:#c9b98a; font-weight:700; z-index:2;}
  .era{position:absolute; top:14px; right:22px; font-size:12px; color:#0d0d26; background:#ffd964; padding:3px 12px; border-radius:99px; font-weight:800; z-index:2;}
</style>
</head>
<body>
<div class="nft">
  <div class="brand">STARSTONE</div>
  <canvas class="art" id="cv" width="480" height="480"></canvas>
  <div class="info">
    <div class="name">StarStone Pass #373</div>
    <div class="tier">Access key</div>
    <div class="chips">
      <span class="chip">Access</span>
      <span class="chip">Pass #373</span>
    </div>
  </div>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const CELL = 15;
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const px = (x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(x * CELL, y * CELL, w * CELL, h * CELL); };

// background stars
const rb = rng(987654321);
for(let i = 0; i < 70; i++){ const x = Math.floor(rb() * 32), y = Math.floor(rb() * 32);
  if(y >= 9 && y <= 23 && x >= 1 && x <= 30) continue;
  ctx.fillStyle = "rgba(207,212,255," + (0.12 + rb() * 0.4).toFixed(2) + ")"; const s = rb() > 0.85 ? 2 : 1; ctx.fillRect(x * CELL, y * CELL, s * 3, s * 3); }

// ticket body: x 2..29, y 10..22
const GOLD = "#ffd964", GOLD_D = "#c99612", BODY = "#1b1b3d", BODY_D = "#12122a", INK = "#0a0a18";
for(let y = 10; y <= 22; y++) for(let x = 2; x <= 29; x++) px(x, y, BODY);
for(let x = 2; x <= 29; x++){ px(x, 10, GOLD); px(x, 22, GOLD); }
for(let y = 10; y <= 22; y++){ px(2, y, GOLD); px(29, y, GOLD); }
for(let x = 3; x <= 28; x++){ px(x, 11, BODY_D); px(x, 21, BODY_D); }
// perforation (stub) at x=8
for(let y = 11; y <= 21; y += 2) px(8, y, GOLD_D);
// stub stars (small diamonds, spaced apart)
function star(cx, cy, c){ px(cx, cy - 1, c); px(cx - 1, cy, c); px(cx, cy, c); px(cx + 1, cy, c); px(cx, cy + 1, c); }
function diamond(cx, cy, c){ px(cx, cy, c); }
star(5, 12, GOLD); star(5, 16, GOLD); star(5, 20, GOLD);
// mini gold gem drawn with the same polygon/facet method as the stones, local grid 9x8 at offset (11,13)
function inPolyL(x, y, pts){ let ins = false; for(let i = 0, j = pts.length - 1; i < pts.length; j = i++){
  const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
  if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins; } return ins; }
const GP = ["#fff8cf","#ffd964","#ff9a1f","#c25e00","#572b00"];
const gpts = [[4,0],[8,2],[6,7],[2,7],[0,2]];
const gIn = [];
for(let y = 0; y < 8; y++){ gIn[y] = []; for(let x = 0; x < 9; x++) gIn[y][x] = inPolyL(x + 0.5, y + 0.5, gpts); }
for(let y = 0; y < 8; y++) for(let x = 0; x < 9; x++){
  if(!gIn[y][x]) continue;
  const edge = !gIn[y-1]?.[x] || !gIn[y+1]?.[x] || !gIn[y]?.[x-1] || !gIn[y]?.[x+1];
  let sh;
  if(edge) sh = 4; else if(y < 2) sh = x < 4 ? 0 : 1; else if(y < 4) sh = x < 4 ? 1 : 2; else sh = x < 4 ? 2 : 3;
  px(11 + x, 13 + y, GP[sh]);
}
diamond(13, 15, "#ffffff"); diamond(17, 14, "#ffffff");
// key teeth suggestion on the right side of the gem: gold key shape
px(20, 15, GOLD, 6, 1); px(25, 16, GOLD, 1, 2); px(23, 16, GOLD, 1, 1);
// barcode strip bottom (y 20), main area x 10..28
const rbar = rng(4242);
let bx = 10;
while(bx < 28){ const w = rbar() > 0.6 ? 1 : 1; px(bx, 20, rbar() > 0.45 ? INK : GOLD_D); bx += 1 + (rbar() > 0.7 ? 1 : 0); }
// sparkles around ticket
star(27, 6, "#ffffff"); star(4, 6, GOLD); star(29, 25, "#ffffff");
</script>
</body>
</html>
